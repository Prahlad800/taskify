<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>try{var savedTheme=localStorage.getItem('taskify-theme');var theme=savedTheme==='dark'||savedTheme==='light'?savedTheme:(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme}catch{document.documentElement.dataset.theme='light'}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5854db" />
    <meta name="description" content="Your colorful space for notes, tasks, and everyday progress." /><title>Taskify | Your daily space</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
