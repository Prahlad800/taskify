<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5854db" />
    <title>Taskify is offline</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7fb;color:#25243d;font:16px/1.6 system-ui,sans-serif}
      main{max-width:440px;margin:24px;padding:32px;border:1px solid #e7e8f1;border-radius:20px;background:white;text-align:center}
      h1{margin:0 0 8px;font-size:28px}p{color:#77788e}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#5854db;color:white;font:inherit;cursor:pointer}
    </style>
  </head>
  <body><main><h1>You’re offline</h1><p>Reconnect to the internet to load your Taskify workspace and sync your notes.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
